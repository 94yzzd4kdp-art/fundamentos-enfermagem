<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro do Aluno</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eaf7ff, #ffffff);
            padding: 20px;
            color: #17324d;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .cabecalho {
            text-align: center;
            margin-bottom: 28px;
        }

        .icone {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #e5f5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #687d90;
            font-size: 14px;
            line-height: 1.5;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccd8e2;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #1687c9;
        }

        .senha-info {
            font-size: 12px;
            color: #718096;
            margin-top: 6px;
            line-height: 1.4;
        }

        .botoes {
            margin-top: 25px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cadastrar {
            background: #1687c9;
            color: white;
        }

        .btn-cadastrar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-voltar {
            margin-top: 12px;
            background: #eef3f7;
            color: #17324d;
        }

        .mensagem {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        .erro {
            background: #ffe9e9;
            color: #a12626;
        }

        .sucesso {
            background: #e8f8ee;
            color: #18733b;
        }

        .aviso {
            margin-top: 22px;
            padding: 14px;
            border-radius: 12px;
            background: #fff7df;
            color: #765d12;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="cabecalho">

        <div class="icone">👨‍🎓</div>

        <h1>Cadastro do Aluno</h1>

        <p class="subtitulo">
            Fundamentos da Enfermagem — Avaliação Online
        </p>

    </div>

    <form id="formCadastro">

        <div class="campo">
            <label for="primeiroNome">
                Primeiro nome
            </label>

            <input
                type="text"
                id="primeiroNome"
                placeholder="Digite seu primeiro nome"
                autocomplete="given-name"
                required>
        </div>

        <div class="campo">
            <label for="segundoNome">
                Segundo nome
            </label>

            <input
                type="text"
                id="segundoNome"
                placeholder="Digite seu segundo nome"
                autocomplete="family-name"
                required>
        </div>

        <div class="campo">
            <label for="matricula">
                Matrícula / Código
            </label>

            <input
                type="text"
                id="matricula"
                placeholder="Digite sua matrícula ou código"
                autocomplete="username"
                required>
        </div>

        <div class="campo">
            <label for="senha">
                Crie sua senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Crie uma senha"
                autocomplete="new-password"
                minlength="6"
                required>

            <p class="senha-info">
                A senha deve possuir pelo menos 6 caracteres.
            </p>
        </div>

        <div class="campo">
            <label for="confirmarSenha">
                Confirme sua senha
            </label>

            <input
                type="password"
                id="confirmarSenha"
                placeholder="Digite a senha novamente"
                autocomplete="new-password"
                required>
        </div>

        <div class="campo">
            <label for="pergunta">
                Pergunta de segurança
            </label>

            <select id="pergunta" required>

                <option value="">
                    Selecione uma pergunta
                </option>

                <option value="animal">
                    Qual era o nome do seu primeiro animal de estimação?
                </option>

                <option value="cidade">
                    Em qual cidade você nasceu?
                </option>

                <option value="escola">
                    Qual era o nome da sua primeira escola?
                </option>

                <option value="cor">
                    Qual é sua cor favorita?
                </option>

                <option value="comida">
                    Qual é sua comida favorita?
                </option>

            </select>
        </div>

        <div class="campo">

            <label for="respostaSeguranca">
                Resposta de segurança
            </label>

            <input
                type="text"
                id="respostaSeguranca"
                placeholder="Digite sua resposta"
                required>

        </div>

        <div class="botoes">

            <button
                type="submit"
                id="btnCadastrar"
                class="btn-cadastrar">

                Criar minha conta

            </button>

            <button
                type="button"
                class="btn-voltar"
                onclick="voltarInicio()">

                Voltar

            </button>

        </div>

        <div
            id="mensagem"
            class="mensagem">
        </div>

    </form>

    <div class="aviso">

        🔐 <strong>Importante:</strong>
        sua senha será tratada pelo sistema de autenticação.
        Ela não será armazenada como texto na tabela de alunos.

    </div>

</div>


<script>

/*
    CONFIGURAÇÃO DO SUPABASE

    A Publishable Key fica no frontend.
    NÃO coloque aqui uma Secret Key ou service_role.
*/

const SUPABASE_URL =
    "https://sxisetxgockdbtjpjnvu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_sfpag8bPf6ynC4cg_sI_Kg_aCnPxPVz";


/*
    Mostra mensagens na tela.
*/

function mostrarMensagem(texto, tipo) {

    const mensagem =
        document.getElementById("mensagem");

    mensagem.textContent = texto;

    mensagem.className =
        "mensagem " + tipo;

    mensagem.style.display = "block";
}


/*
    Cadastro
*/

const formulario =
    document.getElementById("formCadastro");


formulario.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const primeiroNome =
            document
                .getElementById("primeiroNome")
                .value
                .trim();


        const segundoNome =
            document
                .getElementById("segundoNome")
                .value
                .trim();


        const matricula =
            document
                .getElementById("matricula")
                .value
                .trim();


        const senha =
            document
                .getElementById("senha")
                .value;


        const confirmarSenha =
            document
                .getElementById("confirmarSenha")
                .value;


        const pergunta =
            document
                .getElementById("pergunta")
                .value;


        const respostaSeguranca =
            document
                .getElementById("respostaSeguranca")
                .value
                .trim();


        const botao =
            document.getElementById("btnCadastrar");


        /*
            VALIDAÇÕES
        */

        if (
            !primeiroNome ||
            !segundoNome ||
            !matricula ||
            !senha ||
            !confirmarSenha ||
            !pergunta ||
            !respostaSeguranca
        ) {

            mostrarMensagem(
                "Preencha todos os campos.",
                "erro"
            );

            return;
        }


        if (senha.length < 6) {

            mostrarMensagem(
                "A senha deve ter pelo menos 6 caracteres.",
                "erro"
            );

            return;
        }


        if (senha !== confirmarSenha) {

            mostrarMensagem(
                "As senhas não são iguais.",
                "erro"
            );

            return;
        }


        /*
            Evita dois cliques enquanto salva.
        */

        botao.disabled = true;

        botao.textContent =
            "Criando conta...";


        try {

            /*
                Para utilizar a autenticação do Supabase,
                usamos um e-mail técnico baseado na matrícula.

                O aluno continuará usando a matrícula
                na interface do nosso sistema.
            */

            const email =
                matricula
                    .toLowerCase()
                    .replace(/\s+/g, "")
                    + "@aluno.fundamentosenfermagem.local";


            /*
                Cria a conta no Supabase Auth.
            */

            const respostaAuth =
                await fetch(
                    `${SUPABASE_URL}/auth/v1/signup`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "apikey": SUPABASE_KEY
                        },

                        body: JSON.stringify({

                            email: email,

                            password: senha,

                            data: {

                                primeiro_nome:
                                    primeiroNome,

                                segundo_nome:
                                    segundoNome,

                                matricula:
                                    matricula,

                                pergunta_seguranca:
                                    pergunta,

                                resposta_seguranca:
                                    respostaSeguranca

                            }

                        })
                    }
                );


            const dadosAuth =
                await respostaAuth.json();


            if (!respostaAuth.ok) {

                throw new Error(
                    dadosAuth.message ||
                    dadosAuth.error_description ||
                    "Não foi possível criar a conta."
                );

            }


            /*
                Se chegou aqui, a conta foi criada.
            */

            mostrarMensagem(
                "Conta criada com sucesso! Agora você poderá acessar a Área do Aluno.",
                "sucesso"
            );


            /*
                Limpa os campos de senha.
            */

            document
                .getElementById("senha")
                .value = "";

            document
                .getElementById("confirmarSenha")
                .value = "";


            /*
                Depois de alguns segundos,
                vai para o login.
            */

            setTimeout(function() {

                window.location.href =
                    "login-aluno.html";

            }, 2500);


        } catch (erro) {

            console.error(
                "Erro no cadastro:",
                erro
            );


            mostrarMensagem(
                erro.message ||
                "Não foi possível criar a conta.",
                "erro"
            );


        } finally {

            botao.disabled = false;

            botao.textContent =
                "Criar minha conta";

        }

    });


/*
    Voltar para a página inicial.
*/

function voltarInicio() {

    window.location.href =
        "index.html";

}

</script>

</body>
</html>
