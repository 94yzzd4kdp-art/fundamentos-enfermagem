<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área do Professor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eaf7ff, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #17324d;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .cabecalho {
            text-align: center;
            margin-bottom: 30px;
        }

        .icone {
            width: 80px;
            height: 80px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #e5f5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #687d90;
            font-size: 14px;
            line-height: 1.5;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccd8e2;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #1687c9;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .entrar {
            background: #17324d;
            color: white;
        }

        .voltar {
            margin-top: 12px;
            background: #eef3f7;
            color: #17324d;
        }

        .mensagem {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        .erro {
            background: #ffe9e9;
            color: #a12626;
        }

        .info {
            background: #eaf7ff;
            color: #17628e;
        }

        .seguranca {
            margin-top: 25px;
            padding: 14px;
            border-radius: 12px;
            background: #f5f8fa;
            color: #66788a;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="cabecalho">

        <div class="icone">👨‍🏫</div>

        <h1>Área do Professor</h1>

        <p class="subtitulo">
            Fundamentos da Enfermagem — Avaliação Online
        </p>

    </div>

    <form id="formProfessor">

        <div class="campo">

            <label for="senha">
                Senha do professor
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite a senha"
                autocomplete="current-password"
                required>

        </div>

        <button
            type="submit"
            class="entrar">

            Entrar no painel

        </button>

        <button
            type="button"
            class="voltar"
            onclick="voltarInicio()">

            Voltar

        </button>

        <div
            id="mensagem"
            class="mensagem">
        </div>

    </form>

    <div class="seguranca">

        🔐 A área do professor é protegida por senha.

        <br>

        Os resultados dos alunos serão exibidos somente
        no painel administrativo.

    </div>

</div>

<script>

    /*
     * SENHA TEMPORÁRIA DO PROFESSOR
     *
     * Esta senha será substituída/configurada
     * corretamente quando conectarmos o banco
     * de dados e a autenticação.
     */

    const SENHA_PROFESSOR = "Enfermagem2026";


    document
        .getElementById("formProfessor")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const senha =
                document.getElementById("senha").value;

            const mensagem =
                document.getElementById("mensagem");


            if (senha === SENHA_PROFESSOR) {

                /*
                 * Marca temporariamente que o professor
                 * foi autenticado.
                 */

                sessionStorage.setItem(
                    "professorAutenticado",
                    "true"
                );

                mensagem.textContent =
                    "Login realizado. O painel será configurado no próximo passo.";

                mensagem.className =
                    "mensagem info";

                mensagem.style.display =
                    "block";

            } else {

                mensagem.textContent =
                    "Senha incorreta. Tente novamente.";

                mensagem.className =
                    "mensagem erro";

                mensagem.style.display =
                    "block";

            }

        });


    function voltarInicio() {

        window.location.href = "index.html";

    }

</script>

</body>
</html>
